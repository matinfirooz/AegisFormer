[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisformer"
version = "0.1.0"
description = "Research-grade robust Vision Transformer lab: supervised learning, SimCLR, adversarial robustness, calibration, uncertainty, profiling, and export."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matin Firoozbakht"}]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
demo = ["gradio>=4.0", "pillow>=10.0"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

[project.scripts]
aegisformer = "aegisformer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
